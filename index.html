<script>
// ── FIREBASE ──
const firebaseConfig={apiKey:"AIzaSyCKzbeu1sKCrqPepOOkanQStLi8Fg9tBcw",authDomain:"finance-aa677.firebaseapp.com",projectId:"finance-aa677",storageBucket:"finance-aa677.firebasestorage.app",messagingSenderId:"640398989615",appId:"1:640398989615:web:9d4b1c3837374edfd2a9da"};
firebase.initializeApp(firebaseConfig);
const fdb=firebase.firestore();
const cloudDoc=fdb.collection('pushimi2026').doc('data');
try{fdb.enablePersistence({synchronizeTabs:true}).catch(function(){});}catch(e){}

let syncTimer=null;
function setSS(s){
  const el=document.getElementById('syncDot');if(!el)return;
  if(s==='syncing'){el.style.background='#fbbf24';el.style.boxShadow='0 0 8px #fbbf2488';}
  else if(s==='ok'){el.style.background='#4ade80';el.style.boxShadow='0 0 8px #4ade8088';}
  else{el.style.background='#f87171';el.style.boxShadow='none';}
}
function syncPush(){
  setSS('syncing');clearTimeout(syncTimer);
  syncTimer=setTimeout(function(){
    cloudDoc.set({ex:DB.ex,cats:DB.cats,updatedAt:Date.now()})
    .then(function(){setSS('ok');}).catch(function(){setSS('err');});
  },600);
}
function syncPull(){
  return cloudDoc.get().then(function(snap){
    if(snap.exists){
      const d=snap.data();
      if(d.ex)localStorage.setItem('push26_ex',JSON.stringify(d.ex));
      if(d.cats)localStorage.setItem('push26_cats',JSON.stringify(d.cats));
      return true;
    }return false;
  }).catch(function(){setSS('err');return false;});
}

const DB={
  get ex(){return JSON.parse(localStorage.getItem('push26_ex')||'[]');},
  set ex(v){localStorage.setItem('push26_ex',JSON.stringify(v));},
  get cats(){
    const d=[{id:'hotel',n:'Hotel',e:'🏨'},{id:'ushqim',n:'Ushqim',e:'🍽️'},{id:'transport',n:'Transport',e:'✈️'},{id:'blerje',n:'Blerje',e:'🛍️'},{id:'argetime',n:'Argëtim',e:'🎡'},{id:'plazh',n:'Plazh',e:'🏖️'},{id:'pije',n:'Pije/Bar',e:'🍹'},{id:'tjera',n:'Tjera',e:'📦'}];
    return JSON.parse(localStorage.getItem('push26_cats')||JSON.stringify(d));
  },
  set cats(v){localStorage.setItem('push26_cats',JSON.stringify(v));}
};

const fmt=function(n){return Number(n).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});};
const today=function(){return new Date().toISOString().slice(0,10);};
const CC={hotel:['rgba(251,191,36,0.2)','#fbbf24'],ushqim:['rgba(236,72,153,0.2)','#ec4899'],transport:['rgba(59,130,246,0.2)','#60a5fa'],blerje:['rgba(167,139,250,0.2)','#a78bfa'],argetime:['rgba(52,211,153,0.2)','#34d399'],plazh:['rgba(14,165,233,0.2)','#38bdf8'],pije:['rgba(251,146,60,0.2)','#fb923c'],tjera:['rgba(148,163,184,0.15)','#94a3b8']};

let fCat='all', editId=null, selCat=null, selPay='kesh';

// ── CHIP FILTER ──
function setF(id){
  fCat=id;
  document.querySelectorAll('.chip').forEach(function(el){
    el.classList.toggle('on', el.dataset.cat===id);
  });
  render();
}

function renderChips(){
  const bar=document.getElementById('chipBar');
  bar.innerHTML='';
  var allBtn=document.createElement('button');
  allBtn.className='chip'+(fCat==='all'?' on':'');
  allBtn.textContent='Të gjitha';
  allBtn.dataset.cat='all';
  allBtn.addEventListener('click',function(){setF('all');});
  bar.appendChild(allBtn);
  DB.cats.forEach(function(c){
    var btn=document.createElement('button');
    btn.className='chip'+(fCat===c.id?' on':'');
    btn.textContent=c.e+' '+c.n;
    btn.dataset.cat=c.id;
    btn.addEventListener('click',function(){setF(c.id);});
    bar.appendChild(btn);
  });
}

// ── PAY ──
function setPay(p){
  selPay=p;
  document.getElementById('segKesh').classList.toggle('on',p==='kesh');
  document.getElementById('segCard').classList.toggle('on',p==='kartele');
}

// ── CAT GRID ──
function renderCatGrid(){
  var grid=document.getElementById('fCatGrid');
  grid.innerHTML='';
  DB.cats.forEach(function(c){
    var col=CC[c.id]||['rgba(139,92,246,0.2)','#a78bfa'];
    var sel=selCat===c.id;
    var div=document.createElement('div');
    div.className='cat-t';
    div.style.background=sel?col[0]:'rgba(255,255,255,0.06)';
    div.style.border='2px solid '+(sel?col[1]:'rgba(255,255,255,0.1)');
    div.style.boxShadow=sel?('0 0 16px '+col[1]+'44'):'none';
    div.innerHTML='<span class="e">'+c.e+'</span><span class="n" style="color:'+(sel?col[1]:'rgba(255,255,255,0.45)')+'">'+c.n+'</span>';
    div.addEventListener('click',function(){selCat=c.id;renderCatGrid();});
    grid.appendChild(div);
  });
}

// ── RENDER LIST ──
function render(){
  var dF=document.getElementById('dFrom').value;
  var dT=document.getElementById('dTo').value;
  var list=DB.ex.slice().sort(function(a,b){return b.d.localeCompare(a.d)||b.ts-a.ts;});
  if(fCat!=='all') list=list.filter(function(e){return e.cid===fCat;});
  if(dF) list=list.filter(function(e){return e.d>=dF;});
  if(dT) list=list.filter(function(e){return e.d<=dT;});

  var tot=list.reduce(function(s,e){return s+Number(e.a);},0);
  var cash=list.filter(function(e){return e.p==='kesh';}).reduce(function(s,e){return s+Number(e.a);},0);
  var card=list.filter(function(e){return e.p==='kartele';}).reduce(function(s,e){return s+Number(e.a);},0);
  document.getElementById('heroNum').innerHTML=fmt(tot)+'<span class="hero-cur">€</span>';
  document.getElementById('cashAmt').textContent=fmt(cash);
  document.getElementById('cardAmt').textContent=fmt(card);
  document.getElementById('listLbl').textContent=list.length+' shpenzime';
  var per='Të gjitha shpenzimet';
  if(dF&&dT) per=dF+' — '+dT;
  else if(dF) per='Nga '+dF;
  else if(dT) per='Deri '+dT;
  else if(fCat!=='all'){var fc=DB.cats.find(function(x){return x.id===fCat;});if(fc) per=fc.e+' '+fc.n;}
  document.getElementById('heroPeriod').textContent=per;

  var el=document.getElementById('listEl');
  if(!list.length){
    el.innerHTML='<div class="empty"><div class="empty-ico">🏖️</div><div class="empty-t">Nuk ka shpenzime</div><div class="empty-s">Shtyp "+ Shto shpenzim"</div></div>';
    return;
  }
  var wrap=document.createElement('div');
  wrap.className='card-wrap';
  list.forEach(function(e){
    var cat=DB.cats.find(function(c){return c.id===e.cid;})||{n:e.cid,e:'📦'};
    var dc=e.p==='kesh'?'#4ade80':'#60a5fa';
    var col=CC[e.cid]||['rgba(139,92,246,0.15)','#a78bfa'];
    var row=document.createElement('div');
    row.className='erow';
    row.innerHTML='<div class="erow-ico" style="background:'+col[0]+'">'+cat.e+'</div>'+
      '<div class="erow-info">'+
        '<div class="erow-name">'+cat.n+'</div>'+
        '<div class="erow-sub"><span class="erow-dot" style="background:'+dc+'"></span><span>'+(e.p==='kesh'?'Kesh':'Kartele')+'</span><span>·</span><span>'+e.d+'</span></div>'+
        (e.nt?'<div class="erow-note">'+e.nt+'</div>':'')+
      '</div>'+
      '<div class="erow-right">'+
        '<div class="erow-amt">'+fmt(e.a)+'<span class="cur">€</span></div>'+
        '<div class="erow-btns">'+
          '<button class="btn-edit" data-id="'+e.id+'">✎</button>'+
          '<button class="btn-del" data-id="'+e.id+'">✕</button>'+
        '</div>'+
      '</div>';
    row.querySelector('.btn-edit').addEventListener('click',function(){openEdit(this.dataset.id);});
    row.querySelector('.btn-del').addEventListener('click',function(){delEx(this.dataset.id);});
    wrap.appendChild(row);
  });
  el.innerHTML='';
  el.appendChild(wrap);
}

function clearDates(){
  document.getElementById('dFrom').value='';
  document.getElementById('dTo').value='';
  render();
}

// ── FORM ──
function openAdd(){
  editId=null;selCat=null;selPay='kesh';
  document.getElementById('formTitle').textContent='Shpenzim i ri';
  document.getElementById('fAmt').value='';
  document.getElementById('fDate').value=today();
  document.getElementById('fNote').value='';
  setPay('kesh');renderCatGrid();
  document.getElementById('formModal').classList.add('on');
  setTimeout(function(){document.getElementById('fAmt').focus();},300);
}

function openEdit(id){
  var e=DB.ex.find(function(x){return x.id===id;});
  if(!e) return;
  editId=id;selCat=e.cid;selPay=e.p||'kesh';
  document.getElementById('formTitle').textContent='Edito shpenzimin';
  document.getElementById('fAmt').value=e.a;
  document.getElementById('fDate').value=e.d;
  document.getElementById('fNote').value=e.nt||'';
  setPay(e.p||'kesh');renderCatGrid();
  document.getElementById('formModal').classList.add('on');
}

function saveForm(){
  var rawAmt=document.getElementById('fAmt').value.trim().replace(',','.');
  var a=parseFloat(rawAmt);
  var d=document.getElementById('fDate').value;
  var nt=document.getElementById('fNote').value.trim();
  if(!a||a<=0){
    document.getElementById('fAmt').style.color='#f87171';
    setTimeout(function(){document.getElementById('fAmt').style.color='';},1500);
    return;
  }
  if(!selCat){
    var g=document.getElementById('fCatGrid');
    g.style.outline='2px solid #f87171';g.style.borderRadius='12px';
    setTimeout(function(){g.style.outline='';},1500);
    return;
  }
  var ex=DB.ex;
  if(editId){
    var i=ex.findIndex(function(x){return x.id===editId;});
    if(i>-1){ex[i].a=a;ex[i].d=d;ex[i].cid=selCat;ex[i].p=selPay;ex[i].nt=nt;}
  } else {
    ex.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),a:a,d:d,cid:selCat,p:selPay,nt:nt,ts:Date.now()});
  }
  DB.ex=ex;
  closeM('formModal');renderChips();render();syncPush();
}

function delEx(id){
  if(!confirm('Fshi këtë shpenzim?')) return;
  DB.ex=DB.ex.filter(function(e){return e.id!==id;});
  render();syncPush();
}

function closeM(id){document.getElementById(id).classList.remove('on');}

// ── CAT MANAGER ──
function openCats(){renderCM();document.getElementById('catModal').classList.add('on');}
function closeCats(){closeM('catModal');renderChips();render();}

function renderCM(){
  var list=document.getElementById('cmList');
  list.innerHTML='';
  DB.cats.forEach(function(c){
    var row=document.createElement('div');
    row.className='cm-row';
    row.id='cmr-'+c.id;
    row.innerHTML='<span class="cm-em">'+c.e+'</span><span class="cm-nm">'+c.n+'</span>'+
      '<button class="cm-edit">✎</button><button class="cm-del-btn">−</button>';
    row.querySelector('.cm-edit').addEventListener('click',function(){startEditCat(c.id);});
    row.querySelector('.cm-del-btn').addEventListener('click',function(){delCat(c.id);});
    list.appendChild(row);
  });
}

function startEditCat(id){
  var cat=DB.cats.find(function(c){return c.id===id;});if(!cat) return;
  var row=document.getElementById('cmr-'+id);
  row.className='cm-edit-row';
  row.innerHTML='<input class="em-in" id="ece-'+id+'" value="'+cat.e+'" maxlength="2"><input class="nm-in" id="ecn-'+id+'" value="'+cat.n+'"><button class="ok-btn">✓</button><button class="cancel-sm">✕</button>';
  row.querySelector('.ok-btn').addEventListener('click',function(){saveEditCat(id);});
  row.querySelector('.cancel-sm').addEventListener('click',function(){renderCM();});
  document.getElementById('ecn-'+id).focus();
}

function saveEditCat(id){
  var em=document.getElementById('ece-'+id).value.trim()||'📦';
  var nm=document.getElementById('ecn-'+id).value.trim();
  if(!nm) return;
  var cats=DB.cats;
  var i=cats.findIndex(function(c){return c.id===id;});
  if(i>-1){cats[i].e=em;cats[i].n=nm;}
  DB.cats=cats;renderCM();syncPush();
}

function delCat(id){
  if(DB.ex.some(function(e){return e.cid===id;})&&!confirm('Ka shpenzime. Fshi gjithsesi?')) return;
  DB.cats=DB.cats.filter(function(c){return c.id!==id;});
  renderCM();syncPush();
}

function addCat(){
  var e=document.getElementById('newEm').value.trim()||'📦';
  var n=document.getElementById('newNm').value.trim();
  if(!n) return;
  var cats=DB.cats;
  cats.push({id:'c_'+Date.now().toString(36),n:n,e:e});
  DB.cats=cats;
  document.getElementById('newEm').value='';
  document.getElementById('newNm').value='';
  renderCM();syncPush();
}

// ── EVENT LISTENERS ──
document.getElementById('fabBtn').addEventListener('click',openAdd);
document.getElementById('saveFormBtn').addEventListener('click',saveForm);
document.getElementById('cancelFormBtn').addEventListener('click',function(){closeM('formModal');});
document.getElementById('formModal').addEventListener('click',function(e){if(e.target===this)closeM('formModal');});
document.getElementById('openCatsBtn').addEventListener('click',openCats);
document.getElementById('closeCatsBtn').addEventListener('click',closeCats);
document.getElementById('catModal').addEventListener('click',function(e){if(e.target===this)closeCats();});
document.getElementById('addCatBtn').addEventListener('click',addCat);
document.getElementById('doneCatsBtn').addEventListener('click',closeCats);
document.getElementById('dFrom').addEventListener('change',render);
document.getElementById('dTo').addEventListener('change',render);
document.getElementById('clearDatesBtn').addEventListener('click',clearDates);
document.getElementById('segKesh').addEventListener('click',function(){setPay('kesh');});
document.getElementById('segCard').addEventListener('click',function(){setPay('kartele');});
document.getElementById('fAmt').addEventListener('click',function(){this.select();});
document.getElementById('fDate').addEventListener('click',function(){if(this.showPicker)this.showPicker();});
document.getElementById('amtRow').addEventListener('click',function(){document.getElementById('fAmt').focus();});
document.getElementById('dateRow').addEventListener('click',function(){var d=document.getElementById('fDate');d.focus();if(d.showPicker)d.showPicker();});

// ── INIT ──
setSS('syncing');
syncPull().then(function(hadCloud){
  renderChips();render();
  if(!hadCloud) syncPush();
  else setSS('ok');
}).catch(function(){renderChips();render();setSS('err');});
</script>
</body>
</html>
