<script>
<script>
// ── FIREBASE ──
const firebaseConfig = {
  apiKey: "AIzaSyCKzbeu1sKCrqPepOOkanQStLi8Fg9tBcw",
  authDomain: "finance-aa677.firebaseapp.com",
  projectId: "finance-aa677",
  storageBucket: "finance-aa677.firebasestorage.app",
  messagingSenderId: "640398989615",
  appId: "1:640398989615:web:9d4b1c3837374edfd2a9da"
};
firebase.initializeApp(firebaseConfig);
const fdb = firebase.firestore();
const cloudDoc = fdb.collection('pushimi2026').doc('data');
try{ fdb.enablePersistence({synchronizeTabs:true}).catch(function(){}); }catch(e){}

let syncTimer=null;
function setSyncStatus(state){
  const el=document.getElementById('syncDot');
  if(!el) return;
  if(state==='syncing'){el.style.background='#fbbf24';el.style.boxShadow='0 0 8px #fbbf2488';}
  else if(state==='ok'){el.style.background='#4ade80';el.style.boxShadow='0 0 8px #4ade8088';}
  else{el.style.background='#f87171';el.style.boxShadow='none';}
}
function pushToCloud(){
  setSyncStatus('syncing');
  clearTimeout(syncTimer);
  syncTimer=setTimeout(function(){
    cloudDoc.set({ex:DB.ex,cats:DB.cats,updatedAt:Date.now()})
    .then(function(){setSyncStatus('ok');})
    .catch(function(err){console.error('Sync error',err);setSyncStatus('err');});
  },500);
}
function pullFromCloud(){
  return cloudDoc.get().then(function(snap){
    if(snap.exists){
      const d=snap.data();
      if(d.ex) localStorage.setItem('push26_ex',JSON.stringify(d.ex));
      if(d.cats) localStorage.setItem('push26_cats',JSON.stringify(d.cats));
      return true;
    }
    return false;
  }).catch(function(){setSyncStatus('err');return false;});
}

const DB={
  get ex(){return JSON.parse(localStorage.getItem('push26_ex')||'[]')},
  set ex(v){localStorage.setItem('push26_ex',JSON.stringify(v))},
  get cats(){
    const d=[
      {id:'hotel',n:'Hotel',e:'🏨'},{id:'ushqim',n:'Ushqim',e:'🍽️'},
      {id:'transport',n:'Transport',e:'✈️'},{id:'blerje',n:'Blerje',e:'🛍️'},
      {id:'argetime',n:'Argëtim',e:'🎡'},{id:'plazh',n:'Plazh',e:'🏖️'},
      {id:'pije',n:'Pije/Bar',e:'🍹'},{id:'tjera',n:'Tjera',e:'📦'}
    ];
    return JSON.parse(localStorage.getItem('push26_cats')||JSON.stringify(d));
  },
  set cats(v){localStorage.setItem('push26_cats',JSON.stringify(v))}
};

const fmt=n=>Number(n).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().slice(0,10);
let fCat='all',editId=null,selCat=null,selPay='kesh';

const CC={'hotel':['rgba(251,191,36,0.2)','#fbbf24'],'ushqim':['rgba(236,72,153,0.2)','#ec4899'],'transport':['rgba(59,130,246,0.2)','#60a5fa'],'blerje':['rgba(167,139,250,0.2)','#a78bfa'],'argetime':['rgba(52,211,153,0.2)','#34d399'],'plazh':['rgba(14,165,233,0.2)','#38bdf8'],'pije':['rgba(251,146,60,0.2)','#fb923c'],'tjera':['rgba(148,163,184,0.15)','#94a3b8']};

function setPay(p){
  selPay=p;
  document.getElementById('segKesh').classList.toggle('on',p==='kesh');
  document.getElementById('segCard').classList.toggle('on',p==='kartele');
}

function renderChips(){
  let h=`<button class="chip ${fCat==='all'?'on':''}" onclick="setF('all')">Të gjitha</button>`;
  DB.cats.forEach(c=>{h+=`<button class="chip ${fCat===c.id?'on':''}" onclick="setF('${c.id}')">${c.e} ${c.n}</button>`;});
  document.getElementById('chipBar').innerHTML=h;
}

function setF(id){fCat=id;renderChips();render();}

function render(){
  const dF=document.getElementById('dFrom').value;
  const dT=document.getElementById('dTo').value;
  let list=[...DB.ex].sort((a,b)=>b.d.localeCompare(a.d)||b.ts-a.ts);
  if(fCat!=='all') list=list.filter(e=>e.cid===fCat);
  if(dF) list=list.filter(e=>e.d>=dF);
  if(dT) list=list.filter(e=>e.d<=dT);
  const tot=list.reduce((s,e)=>s+Number(e.a),0);
  const cash=list.filter(e=>e.p==='kesh').reduce((s,e)=>s+Number(e.a),0);
  const card=list.filter(e=>e.p==='kartele').reduce((s,e)=>s+Number(e.a),0);
  document.getElementById('heroNum').innerHTML=fmt(tot)+'<span class="hero-cur">€</span>';
  document.getElementById('cashAmt').textContent=fmt(cash);
  document.getElementById('cardAmt').textContent=fmt(card);
  document.getElementById('listLbl').textContent=list.length+' shpenzime';
  let per='Të gjitha shpenzimet';
  if(dF&&dT) per=dF+' — '+dT;
  else if(dF) per='Nga '+dF;
  else if(dT) per='Deri '+dT;
  else if(fCat!=='all'){const c=DB.cats.find(x=>x.id===fCat);if(c) per=c.e+' '+c.n;}
  document.getElementById('heroPeriod').textContent=per;
  const el=document.getElementById('listEl');
  if(!list.length){
    el.innerHTML='<div class="empty"><div class="empty-ico">🏖️</div><div class="empty-t">Nuk ka shpenzime</div><div class="empty-s">Shtyp "+ Shto shpenzim"</div></div>';
    return;
  }
  el.innerHTML='<div class="card-wrap">'+list.map(e=>{
    const cat=DB.cats.find(c=>c.id===e.cid)||{n:e.cid,e:'📦'};
    const dc=e.p==='kesh'?'#4ade80':'#60a5fa';
    const col=CC[e.cid]||['rgba(139,92,246,0.15)','#a78bfa'];
    return `<div class="erow">
      <div class="erow-ico" style="background:${col[0]}">${cat.e}</div>
      <div class="erow-info">
        <div class="erow-name">${cat.n}</div>
        <div class="erow-sub"><span class="erow-dot" style="background:${dc}"></span><span>${e.p==='kesh'?'Kesh':'Kartele'}</span><span>·</span><span>${e.d}</span></div>
        ${e.nt?`<div class="erow-note">${e.nt}</div>`:''}
      </div>
      <div class="erow-right">
        <div class="erow-amt">${fmt(e.a)}<span class="cur">€</span></div>
        <div class="erow-btns">
          <button class="btn-edit" onclick="openEdit('${e.id}')">✎</button>
          <button class="btn-del" onclick="delEx('${e.id}')">✕</button>
        </div>
      </div>
    </div>`;
  }).join('')+'</div>';
}

function clearDates(){document.getElementById('dFrom').value='';document.getElementById('dTo').value='';render();}

function renderCatGrid(){
  document.getElementById('fCatGrid').innerHTML=DB.cats.map(c=>{
    const col=CC[c.id]||['rgba(139,92,246,0.2)','#a78bfa'];
    const sel=selCat===c.id;
    return `<div class="cat-t" onclick="selCatFn('${c.id}')" style="background:${sel?col[0]:'rgba(255,255,255,0.06)'};border:2px solid ${sel?col[1]:'rgba(255,255,255,0.1)'};box-shadow:${sel?'0 0 16px '+col[1]+'44':'none'}">
      <span class="e">${c.e}</span>
      <span class="n" style="color:${sel?col[1]:'rgba(255,255,255,0.45)'}">${c.n}</span>
    </div>`;
  }).join('');
}
function selCatFn(id){selCat=id;renderCatGrid();}

function openAdd(){
  editId=null;selCat=null;selPay='kesh';
  document.getElementById('formTitle').textContent='Shpenzim i ri';
  document.getElementById('fAmt').value='';
  document.getElementById('fDate').value=today();
  document.getElementById('fNote').value='';
  setPay('kesh');renderCatGrid();
  document.getElementById('formModal').classList.add('on');
  setTimeout(()=>document.getElementById('fAmt').focus(),300);
}
function openEdit(id){
  const e=DB.ex.find(x=>x.id===id);
  if(!e) return;
  editId=id;selCat=e.cid;selPay=e.p||'kesh';
  document.getElementById('formTitle').textContent='Edito shpenzimin';
  document.getElementById('fAmt').value=e.a;
  document.getElementById('fDate').value=e.d;
  document.getElementById('fNote').value=e.nt||'';
  setPay(e.p||'kesh');renderCatGrid();
  document.getElementById('formModal').classList.add('on');
}
function saveForm(){
  const a=parseFloat(document.getElementById('fAmt').value);
  const d=document.getElementById('fDate').value;
  const nt=document.getElementById('fNote').value.trim();
  const inp=document.getElementById('fAmt');
  if(!a||a<=0){inp.style.color='#f87171';setTimeout(()=>inp.style.color='',1200);return;}
  if(!selCat){
    const g=document.getElementById('fCatGrid');
    g.style.outline='2px solid #f87171';g.style.borderRadius='12px';
    setTimeout(()=>{g.style.outline='';},1200);return;
  }
  const ex=DB.ex;
  if(editId){
    const i=ex.findIndex(x=>x.id===editId);
    if(i>-1){ex[i].a=a;ex[i].d=d;ex[i].cid=selCat;ex[i].p=selPay;ex[i].nt=nt;}
  } else {
    ex.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),a,d,cid:selCat,p:selPay,nt,ts:Date.now()});
  }
  DB.ex=ex;
  closeM('formModal');renderChips();render();pushToCloud();
}
function delEx(id){
  if(!confirm('Fshi këtë shpenzim?')) return;
  DB.ex=DB.ex.filter(e=>e.id!==id);
  render();pushToCloud();
}
function closeM(id){document.getElementById(id).classList.remove('on');}
function openCats(){renderCM();document.getElementById('catModal').classList.add('on');}
function closeCats(){closeM('catModal');renderChips();render();}
function renderCM(){
  document.getElementById('cmList').innerHTML=DB.cats.map(c=>
    `<div class="cm-row" id="cmr-${c.id}">
      <span class="cm-em">${c.e}</span><span class="cm-nm">${c.n}</span>
      <button class="cm-edit" onclick="startEditCat('${c.id}')">✎</button>
      <button class="cm-del-btn" onclick="delCat('${c.id}')">−</button>
    </div>`
  ).join('');
}
function startEditCat(id){
  const cat=DB.cats.find(c=>c.id===id);if(!cat) return;
  document.getElementById('cmr-'+id).outerHTML=
    `<div class="cm-edit-row" id="cmr-${id}">
      <input class="em-in" id="ece-${id}" value="${cat.e}" maxlength="2">
      <input class="nm-in" id="ecn-${id}" value="${cat.n}">
      <button class="ok-btn" onclick="saveEditCat('${id}')">✓</button>
      <button class="cancel-sm" onclick="renderCM()">✕</button>
    </div>`;
  document.getElementById('ecn-'+id).focus();
}
function saveEditCat(id){
  const em=document.getElementById('ece-'+id).value.trim()||'📦';
  const nm=document.getElementById('ecn-'+id).value.trim();
  if(!nm) return;
  const cats=DB.cats;
  const i=cats.findIndex(c=>c.id===id);
  if(i>-1){cats[i].e=em;cats[i].n=nm;}
  DB.cats=cats;renderCM();pushToCloud();
}
function delCat(id){
  if(DB.ex.some(e=>e.cid===id)&&!confirm('Ka shpenzime. Fshi gjithsesi?')) return;
  DB.cats=DB.cats.filter(c=>c.id!==id);
  renderCM();pushToCloud();
}
function addCat(){
  const e=document.getElementById('newEm').value.trim()||'📦';
  const n=document.getElementById('newNm').value.trim();
  if(!n) return;
  const cats=DB.cats;
  cats.push({id:'c_'+Date.now().toString(36),n,e});
  DB.cats=cats;
  document.getElementById('newEm').value='';
  document.getElementById('newNm').value='';
  renderCM();pushToCloud();
}

// ── INIT ──
setSyncStatus('syncing');
pullFromCloud().then(function(hadCloud){
  renderChips();render();
  if(!hadCloud) pushToCloud();
  else setSyncStatus('ok');
}).catch(function(){renderChips();render();setSyncStatus('err');});
</script>
</body>
</html>
